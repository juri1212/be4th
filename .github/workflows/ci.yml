# Checks every pull request before it can reach main: lint, then a full build (type check, client and
# SSR bundles, prerender). The build skips the activity fetch, so it needs no secrets and runs on fork
# PRs too; the graphs just ship empty, as in any local build without `npm run fetch-activity`.
on:
  pull_request:
  workflow_dispatch:

name: CI

permissions:
  contents: read

# A new push to the same PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0 # full history, for sitemap lastmod dates

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      run: npm ci

    # tsc -b runs first, so this is also the type check.
    - name: Build project
      run: npm run build
