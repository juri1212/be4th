on:
  push:
    branches:
      - main

name: Deploy website

# Shared with activity-data.yml, so the two never upload at the same time.
concurrency:
  group: ftp
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0 # full history, for sitemap lastmod dates

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Install dependencies
      run: npm install
      working-directory: ./cyclist-scroll/

    - name: Build project
      run: npm run build
      working-directory: ./cyclist-scroll/

    - name: Deploy to FTP server
      uses: SamKirkland/FTP-Deploy-Action@v4.4.0
      with:
        server: ${{ vars.FTP_SERVER }}
        username: ${{ vars.FTP_USER }}
        password: ${{ secrets.FTP_PASS }}
        protocol: ftps
        port: 21
        local-dir: ./cyclist-scroll/dist/
        # /data/ belongs to activity-data.yml. The build never contains it; this keeps it that way.
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          data/**