# Builds the site with fresh activity data and publishes it to GitHub Pages (https://be4th.com).
# Runs on every push to main, and nightly so the activity graphs stay current.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # 05:17 in Berlin in summer, 04:17 in winter
  workflow_dispatch:

name: Deploy website

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A queued run waits rather than cancelling one that's halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0 # full history, for sitemap lastmod dates

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24

    # Fails on any error, so nothing is deployed and the live site keeps its current data.
    - name: Fetch activity
      run: node scripts/fetch-activity.ts
      env:
        STRAVA_CLIENT_ID: ${{ vars.STRAVA_CLIENT_ID }}
        STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
        STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}

    - name: Install dependencies
      run: npm install

    # Includes .data/ as dist/data/ (plugins/activity-data.ts).
    - name: Build project
      run: npm run build

    - name: Upload site
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
